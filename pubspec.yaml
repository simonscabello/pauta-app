name: louvor_app
description: Pauta - sua equipe no mesmo ritmo
publish_to: "none"
version: 0.24.0+31

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Estado + injecao de dependencia
  flutter_riverpod: ^2.5.1
  # Navegacao com guarda de rota por estado de autenticacao
  go_router: ^14.2.0
  # HTTP
  dio: ^5.5.0
  # Tokens (etapa 1)
  flutter_secure_storage: ^9.2.2
  # Equipe ativa / cache do ultimo estado
  shared_preferences: ^2.3.0
  # Datas em pt_BR. A versao e fixada pelo flutter_localizations do SDK.
  intl: ^0.20.2
  timezone: ^0.11.1
  share_plus: ^12.0.2
  # Abrir cifra, letra, YouTube e Spotify no app de fora. A cifra precisa
  # abrir no navegador ou no app do CifraClub -- nao embutimos o conteudo.
  url_launcher: ^6.3.0
  # Foto de perfil. A imagem ja sai reduzida do picker (ver profile_screen):
  # o backend aceita ate 5 MB, e foto de celular passa disso com folga.
  image_picker: ^1.1.2
  # Lê a versão realmente instalada para comparar com GET /version. Manter
  # isto automático evita um segundo número de versão esquecido no código.
  # 9.x enquanto share_plus 12 fixa win32 5.x; a 10.x exige win32 6.x.
  package_info_plus: ^9.0.1
  # Icones das funcoes (violao, bateria, mesa de som). O Material Icons do
  # Flutter nao tem instrumentos: so mic, piano e music_note. A fonte vai
  # empacotada no APK, sem download em runtime -- mesma razao da Plus Jakarta.
  # A 10.x nao compila neste SDK: ela estende `IconData`, que virou
  # `final class` no Flutter novo. So a 11.x corrigiu.
  font_awesome_flutter: ^11.0.0
  # Notificacoes push. So Android neste projeto: nao ha pasta ios/, e o push
  # na Web (VAPID + service worker) ficou de fora do v1 -- a versao Web se usa
  # sentado na mesa, onde a agenda ja esta aberta.
  #
  # As tres andam juntas e nenhuma e dispensavel:
  # - firebase_core: inicializa o SDK a partir do google-services.json;
  # - firebase_messaging: token do aparelho e as mensagens que chegam;
  # - flutter_local_notifications: **com o app aberto o FCM nao desenha nada**.
  #   Sem esta, o aviso simplesmente nao aparece para quem esta com o app na
  #   mao -- que e o caso mais facil de testar e o mais facil de dar como
  #   quebrado.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  local_auth: 3.0.2
  # Mantém a tela ligada enquanto a letra está aberta (modo leitura): quem
  # canta com o celular na estante não pode ver a tela apagar no meio da
  # música. Na Web usa a Screen Wake Lock API; onde ela não existe, nada muda.
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# O arquivo cheio atende Android antigo; foreground e monochrome preservam as
# camadas do ícone adaptativo e o ícone temático do Android 13+. As camadas são
# geradas por tools/generate_brand_assets.py. Sem pasta ios neste projeto.
#
# **As duas camadas adaptativas apontam para o símbolo branco, não para o
# colorido.** O fundo é o violeta profundo da marca, e o símbolo colorido sobre
# ele entrega de 1,19:1 a 1,61:1 — some. O branco dá 11,13:1, que é exatamente o
# que o ícone completo entregue pelo design mostra: peça clara sobre violeta.
# O colorido é o símbolo para fundo claro, e é assim que o app o usa.
#
# **E apontam para o derivado, não para o master.** O símbolo entregue ocupa
# 42,2% de raio; a máscara redonda do Android garante 30,6%. Sem a redução, as
# pontas do P saem cortadas no lançador.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/pauta_icon.png
  adaptive_icon_background: "#312E81"
  adaptive_icon_foreground: assets/branding/pauta_adaptive_foreground.png
  adaptive_icon_monochrome: assets/branding/pauta_adaptive_foreground.png
  # O recuo já está embutido no arquivo derivado, medido contra o círculo real
  # da máscara. Um recuo por cima dele encolheria a peça duas vezes.
  adaptive_icon_foreground_inset: 0
  web:
    # O gerador do pacote usa a mesma imagem para ícones normais e maskable.
    # Nossa fonte gera o normal com cantos transparentes e o maskable cheio.
    generate: false
    background_color: "#312E81"
    theme_color: "#312E81"

flutter:
  uses-material-design: true

  # O símbolo oficial da marca, nas duas artes que a identidade entrega: a
  # branca para fundo violeta/escuro e a colorida para fundo claro. `AppBrandMark`
  # escolhe entre elas pela luminância do ladrilho, porque no tema escuro o
  # quadrado da marca é claro e a arte branca sumiria dentro dele.
  #
  # São os derivados de 512px, e não os masters de 1254: o app nunca desenha a
  # marca acima de ~110dp, e empacotar 600 KB para pintar 40px é peso que a
  # versão Web baixa no primeiro quadro. Os masters ficam em assets/branding
  # como fonte, fora do bundle.
  assets:
    - assets/branding/pauta_symbol_on_dark.png
    - assets/branding/pauta_symbol_on_light.png

  # A fonte vai empacotada no APK de proposito. Com o pacote google_fonts ela
  # era baixada de fonts.gstatic.com na primeira execucao: o app dependia de um
  # segundo servidor alem da API e, em rede ruim, a primeira renderizacao caia
  # para a fonte do sistema -- a identidade visual degradava em silencio.
  # Plus Jakarta Sans e licenciada sob a SIL Open Font License, que permite
  # a distribuicao junto do aplicativo.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
