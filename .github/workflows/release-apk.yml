# Publica o APK como Release do GitHub.
#
# Por que existe: a equipe não baixa da Play Store. Até aqui o APK saía da
# máquina de quem desenvolve e ia parar no WhatsApp ou no Drive, com o líder
# reenviando o arquivo a cada versão. Com o Release, o `GET /version` da API
# aponta para uma URL fixa e o próprio app oferece o botão "Atualizar"
# (ver AppUpdateBanner).
#
# **A assinatura é o ponto delicado.** O APK precisa sair assinado com a MESMA
# chave dos anteriores; um APK assinado com outra chave (a de debug, por
# exemplo) o Android recusa instalar por cima do app já existente -- a pessoa
# teria de desinstalar e perder a sessão. Por isso este fluxo exige os quatro
# segredos abaixo e **falha de propósito** se algum faltar, em vez de produzir
# calado um arquivo que ninguém consegue instalar.
#
#   Settings → Secrets and variables → Actions → New repository secret
#
#     ANDROID_KEYSTORE_BASE64   o .jks em base64 (comando no docs/DEPLOY.md do repo pauta)
#     ANDROID_KEYSTORE_PASSWORD storePassword do android/key.properties
#     ANDROID_KEY_ALIAS         keyAlias (hoje: louvor)
#     ANDROID_KEY_PASSWORD      keyPassword
#
# Como publicar uma versão:
#
#   1. suba o `version:` do pubspec.yaml (ex.: 0.2.0+5) e faça commit;
#   2. `git tag v0.2.0 && git push origin v0.2.0`;
#   3. quando o Release aparecer, suba no Railway (serviço da API):
#        APP_LATEST_VERSION = 0.2.0
#
# **Só essa.** O APP_APK_URL é configurado UMA vez e nunca mais:
#
#   APP_APK_URL = https://github.com/simonscabello/escala-app/releases/latest/download/louve.apk
#
# O `latest/download` do GitHub segue sozinho o Release mais novo, e o workflow
# publica sempre uma cópia de nome fixo (louve.apk) para esse endereço achar.
#
# **O nome dos arquivos continua `louve`, e não `pauta`, de propósito.** A marca
# mudou; este nome não é marca, é o identificador que o `APP_APK_URL` já aponta
# em produção. Renomear aqui sem trocar a variável no Railway no mesmo minuto
# quebra o botão "Atualizar" de quem já tem o app instalado. Quando for a hora,
# as duas coisas mudam juntas — ou o workflow publica os dois nomes por uma
# versão, e só então o antigo sai.
#
# O passo 3 continua manual de propósito: publicar o arquivo e *anunciar* a
# versão para a equipe são decisões diferentes. Enquanto APP_LATEST_VERSION não
# subir, o Release fica disponível para quem quiser testar sem que o app cobre
# a atualização de ninguém.

name: Release do APK

on:
  push:
    tags:
      - "v*"
  # Permite repetir a publicação de uma tag que já existe, sem criá-la de novo.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag já existente a publicar (ex.: v0.2.0)"
        required: true

permissions:
  # `gh release create` escreve no repositório. Nada além disso.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descobrir a tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # O app compara a versão instalada (package_info_plus) com a que a API
      # anuncia. Uma tag que não bate com o pubspec produziria um Release
      # "0.2.0" que se instala e continua se apresentando como 0.1.0 -- e o
      # aviso de atualização nunca sumiria da tela da equipe.
      - name: Conferir se a tag bate com o pubspec
        run: |
          PUBSPEC=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          if [ "$PUBSPEC" != "$TAG_VERSION" ]; then
            echo "::error::A tag diz $TAG_VERSION e o pubspec.yaml diz $PUBSPEC."
            echo "::error::Acerte o 'version:' do pubspec, refaça o commit e a tag."
            exit 1
          fi
          echo "Versão $PUBSPEC confirmada."

      # Falha aqui, e não depois do build: quinze minutos de compilação para
      # descobrir no fim que o arquivo sai inútil seria o pior lugar para
      # avisar.
      - name: Conferir os segredos de assinatura
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          faltando=""
          [ -z "$KEYSTORE" ]       && faltando="$faltando ANDROID_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && faltando="$faltando ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]      && faltando="$faltando ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]   && faltando="$faltando ANDROID_KEY_PASSWORD"
          if [ -n "$faltando" ]; then
            echo "::error::Faltam segredos de assinatura:$faltando"
            echo "::error::Sem eles o APK sairia assinado com a chave de debug, e"
            echo "::error::quem já tem o app instalado não conseguiria atualizar."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Mesma versão da máquina de desenvolvimento. Fixa de propósito: o
          # canal `stable` muda sozinho, e o build da equipe não pode mudar
          # junto sem alguém decidir.
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Restaurar a chave de assinatura
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/louvor-release.jks"
          # O android/build.gradle.kts lê este arquivo; o caminho é absoluto
          # porque o .properties não expande variáveis.
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/louvor-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # O universal é o que vai no APP_APK_URL: uma URL só, que instala em
      # qualquer aparelho. Pedir a alguém da equipe que descubra a arquitetura
      # do próprio celular não é uma pergunta que se faz. Os por-arquitetura
      # vão junto no Release para quem quiser economizar dados.
      - name: Build do APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://api.pautalouvor.com.br
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL=https://api.pautalouvor.com.br

      - name: Nomear os arquivos com a versão
        id: artefatos
        run: |
          V="${{ steps.tag.outputs.version }}"
          cd build/app/outputs/flutter-apk
          mv app-release.apk "louve-$V.apk"
          mv app-arm64-v8a-release.apk "louve-$V-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "louve-$V-armeabi-v7a.apk"
          mv app-x86_64-release.apk "louve-$V-x86_64.apk"
          # Cópia com nome FIXO, e é ela que o APP_APK_URL aponta:
          # https://github.com/<repo>/releases/latest/download/louve.apk
          # sempre cai no Release mais novo. Sem isto, a URL carregaria a
          # versão no nome e teria de ser reescrita no Railway a cada
          # publicação -- um campo a mais para errar de madrugada, e um botão
          # "Atualizar" que baixa 404 quando se erra.
          cp "louve-$V.apk" louve.apk
          ls -lh louve*.apk

      # `gh` já vem no runner: nenhuma ação de terceiro precisa do token.
      - name: Publicar o Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.tag.outputs.version }}"
          TAG="${{ steps.tag.outputs.tag }}"
          cd build/app/outputs/flutter-apk

          NOTAS=$(cat <<EOF
          Baixe **louve-$V.apk** e abra no celular. Se o Android perguntar,
          autorize a instalação de apps desta origem.

          Já tem a Pauta instalada? É só instalar por cima — os dados e a
          sessão continuam.

          Os arquivos por arquitetura são menores e servem para economizar
          dados de quem sabe qual usar; na dúvida, use o de cima.

          (\`louve.apk\`, sem número, é a cópia de nome fixo que o botão
          "Atualizar" dentro do app baixa. É o mesmo arquivo do primeiro item.)
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" louve*.apk --clobber
          else
            gh release create "$TAG" louve*.apk \
              --title "Pauta $V" \
              --notes "$NOTAS"
          fi

          echo "### APK $V publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Falta **um** passo para a equipe ser avisada: no Railway," >> "$GITHUB_STEP_SUMMARY"
          echo "serviço da API, defina" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "APP_LATEST_VERSION = $V" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "O \`APP_APK_URL\` **não muda nunca mais** -- ele aponta para" >> "$GITHUB_STEP_SUMMARY"
          echo "\`releases/latest/download/louve.apk\`, que segue sozinho o" >> "$GITHUB_STEP_SUMMARY"
          echo "Release mais novo." >> "$GITHUB_STEP_SUMMARY"
